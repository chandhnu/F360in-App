<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F360in - Enterprise Financial Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #1a3009 100%);
            min-height: 100vh;
            color: #333;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #2d5016 0%, #1a3009 100%);
        }

        .login-card {
            background: #f5f1ed;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .login-header-logo {
            max-width: 150px !important;
            height: auto !important;
            margin: 0 auto !important;
            display: block !important;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .login-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .footer-logo {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .footer-logo img {
            max-width: 60px;
            height: auto;
            margin-bottom: 0.5rem;
        }

        .footer-logo p {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        .user-btn {
            padding: 16px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .user-btn:hover {
            background: #e8f5e9;
            border-color: #2d5016;
            color: #2d5016;
        }

        .user-btn.active {
            background: linear-gradient(135deg, #2d5016 0%, #1a3009 100%);
            color: white;
            border-color: transparent;
        }

        .password-group {
            margin-bottom: 1.5rem;
        }

        .password-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .password-group input:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2d5016 0%, #1a3009 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(45, 80, 22, 0.3);
        }

        .error-msg {
            color: #e34948;
            font-size: 13px;
            text-align: center;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .dashboard.active {
            display: block;
        }

        .top-bar {
            background: white;
            border-bottom: 2px solid #2d5016;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .top-bar-left img {
            height: 40px;
            width: auto;
        }

        .top-bar-center {
            flex: 1;
            margin-left: 2rem;
        }

        .top-bar-center h2 {
            font-size: 20px;
            font-weight: 700;
            color: #2d5016;
            margin: 0;
        }
