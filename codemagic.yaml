workflows:
  ios-release:
    name: F360in iOS Release Build
    environment:
      xcode: latest
      flutter: stable
      groups:
        - ios_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v\d+\.\d+\.\d+'
          include: true
    scripts:
      - name: Setup Flutter
        script: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install --repo-update
          
      - name: Build iOS App
        script: |
          flutter build ios --release \
            --no-codesign \
            -v
            
      - name: Build archive for TestFlight
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/ios_build \
            -archivePath build/ios_build/Runner.xcarchive \
            -allowProvisioningUpdates \
            archive
            
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          xcodebuild \
            -exportArchive \
            -archivePath build/ios_build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa
            
    artifacts:
      - build/ipa/*.ipa
      - build/ios_build/Runner.xcarchive/**
      
    publishing:
      app_store_connect:
        auth: integration
        
  ios-debug:
    name: F360in iOS Debug Build
    environment:
      xcode: latest
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
    scripts:
      - name: Setup Flutter
        script: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install --repo-update
          
      - name: Build iOS Debug
        script: |
          flutter build ios --debug \
            --no-codesign \
            -v
            
    artifacts:
      - build/ios/**
      
  android-release:
    name: F360in Android Release Build
    environment:
      java: default
      flutter: stable
      groups:
        - android_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v\d+\.\d+\.\d+'
          include: true
    scripts:
      - name: Setup Flutter
        script: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release -v
          
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

