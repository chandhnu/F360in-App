name: f360in
description: F360in - Personal Wealth Operating System. A premium private wealth management platform for individuals, families, HUF, and businesses.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  uuid: ^4.0.0
  decimal: ^2.1.0
  intl: ^0.19.0
  logger: ^2.0.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
