workflows:
  web-release:
    name: F360in Web PWA Release Build
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Setup Flutter
        script: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Build Web
        script: |
          flutter build web --release -v
          
      - name: Deploy to GitHub Pages
        script: |
          cd $CM_BUILD_DIR
          git config user.email "chandhnu@gmail.com"
          git config user.name "CodeMagic CI"
          git checkout main
          rm -rf docs
          mkdir -p docs
          cp -r build/web/* docs/
          touch docs/.nojekyll
          git add docs/
          git commit -m "Deploy: Update docs from build [skip ci]" || true
          git push origin main
          
    artifacts:
      - build/web/**
      
  android-release:
    name: F360in Android Release Build
    environment:
      java: default
      flutter: stable
      groups:
        - android_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v\d+\.\d+\.\d+'
          include: true
    scripts:
      - name: Setup Flutter
        script: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release -v
          
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
